function go(id){location.hash=id}function back(){sound('back');if(document.querySelector('.modal-backdrop')){closeModal();return}go(({attachments:'loadouts',controls:'settings',modes:'home',loadouts:'home',settings:'home',career:'home',social:'home',hud:'home'})[screen]||'home')}
function weapon(){return `<svg class="weapon-svg" viewBox="0 0 800 230" role="img" aria-label="Silhueta ilustrativa de um fuzil"><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#91a2a3"/><stop offset=".45" stop-color="#40545a"/><stop offset="1" stop-color="#1d3036"/></linearGradient></defs><path fill="#25383c" d="M35 92L185 78 225 99 210 130 78 128 35 145Z"/><path fill="url(#metal)" d="M188 82H432L481 95 474 132H213Z"/><path fill="#537075" d="M431 84H640L668 94 660 116H430Z"/><rect fill="#263f45" x="650" y="94" width="106" height="11" rx="3"/><path fill="#385158" d="M282 124L326 128 307 195 269 179Z"/><path fill="#758785" d="M363 125L407 124 427 190 382 201Z"/><path fill="none" d="M324 132V157H363V134"/><rect fill="#334b50" x="265" y="65" width="46" height="16" rx="3"/><rect fill="#617b7e" x="208" y="77" width="238" height="5"/><path fill="none" d="M450 90V113M468 90V113M487 90V113M505 90V113M523 90V113M541 90V113M560 90V113M578 90V113M596 90V113M614 90V113"/><rect fill="#12272d" x="253" y="99" width="74" height="10" rx="3"/></svg>`}
function title(kicker,name,description=''){return `<div class="page-title"><div><div class="eyebrow">${kicker}</div><h2 style="margin-top:12px">${name}</h2>${description?`<p class="subtle">${description}</p>`:''}</div><span class="tag">ESTUDO DE COMPOSIÇÃO</span></div>`}
function destinations(){return `<div class="destinations">${[['loadouts','Armamentos'],['career','Carreira'],['social','Social'],['settings','Configurações']].map(([id,n])=>`<button class="destination" onclick="go('${id}')"><b>${n}</b><i>↗</i></button>`).join('')}</div>`}
function home(b=false){return b?`<section class="home-b"><div class="eyebrow">INICIAL B · AÇÃO E DESTINOS EM UMA FAIXA</div><h1>CROSSGROUNDS<span class="cyan">.</span></h1><p class="subtle">Escolha seu próximo confronto.</p><div class="b-actions"><button class="primary" onclick="go('modes')">Jogar <span>Modalidades e entrada na partida ↗</span></button><button class="card" onclick="go('loadouts')"><h3>Armamentos ↗</h3><span class="subtle">Escolha uma classe. Faça do seu jeito.</span></button><button class="card" onclick="go('career')"><h3>Carreira ↗</h3><span class="subtle">Sua identidade e sua evolução.</span></button></div><div class="minor-links"><button class="link" onclick="go('social')">Social e grupo ↗</button><button class="link" onclick="go('settings')">Configurações ↗</button><button class="link" onclick="modal('Explorar o lobby','No jogo, esta ação fechará a navegação. O acesso ao menu continuará disponível.')">Explorar o lobby ↗</button></div></section>`:`<section class="home"><div class="home-title"><div class="eyebrow">INICIAL A · CENÁRIO E AÇÃO PRINCIPAL</div><h1>CROSSGROUNDS<span class="cyan">.</span></h1><p class="subtle">Entre na disputa. Monte seu equipamento.<br>Encontre seu ritmo.</p><button class="primary home-action" onclick="go('modes')">Jogar <span>↗</span></button>${destinations()}<button class="link" onclick="modal('Explorar o lobby','No jogo, esta ação fechará a navegação. O acesso ao menu continuará disponível.')">Explorar o lobby →</button></div><aside class="home-context card"><div class="art"></div><div class="eyebrow">DESTINO EM DESTAQUE</div><h3>Capture a bandeira.</h3><p class="subtle">Ataque, proteja e volte para sua base.</p><button class="link" onclick="go('modes')">Conhecer as modalidades →</button><p class="spec-note">Ambientação abstrata provisória. Uma cena dedicada será estudada somente para a inicial.</p></aside></section>`}
function modes(){return title('Jogar','Escolha seu confronto.','Os caminhos são claros antes da entrada. A seleção não inicia uma partida neste protótipo.')+`<div class="modes">${[['Conflict','Capture. Proteja. Retorne.','CTF'],['Arena','Confrontos rápidos. Equipamento direto.','ARENA'],['Get Out','Sobreviva em equipe.','EM DESENVOLVIMENTO']].map(([name,d,t],i)=>`<button class="card mode" onclick="${i===2?`modal('Estado de disponibilidade','A disponibilidade final virá do catálogo real. Esta opção não tenta entrar em um modo.')`:`modal('${name}','Entrada demonstrativa. Na implementação, esta região mostrará grupo, disponibilidade, confirmação e cancelamento. Nenhuma partida foi iniciada.')`}"><div class="art"></div><div class="eyebrow">${t}</div><h2>${name}</h2><p class="subtle">${d}</p><small>${i===2?'Consultar disponibilidade':'Escolher modalidade →'}</small></button>`).join('')}</div>`}
function loadouts(){return title('Equipamento','Armamentos','Escolha uma classe para jogar. Entre na edição para ajustar seu equipamento.')+`<div class="workbench"><section><div class="eyebrow" style="margin-bottom:18px">SUAS CLASSES · EXEMPLOS DE NAVEGAÇÃO</div><div class="class-list">${classes.map(([num,name,w],i)=>`<button class="class-card ${selectedClass===i?'on':''}" onclick="selectedClass=${i};render(false)"><span>${num}</span><div><strong>${name}</strong><span>${w} · secundária · melee</span></div><span class="active-label">${equippedClass===i?'✓ ESCOLHIDA':selectedClass===i?'EM FOCO':'↗'}</span></button>`).join('')}</div><p class="hint">Foco indica o que você está examinando. “Escolhida” indica a classe selecionada.</p><button class="link" onclick="modal('Gerenciar classe','Renomear, duplicar e excluir ficarão neste painel contextual. Estas operações não alteram dados reais.')">••• Gerenciar classe</button></section><section><div class="weapon-meta"><div><div class="eyebrow">${classes[selectedClass][1]}</div><h2>${classes[selectedClass][2]}</h2></div><span class="tag">ARMA PRINCIPAL</span></div><div class="weapon-stage">${weapon()}</div><div class="divider"></div><p class="subtle">A escolha entra em vigor no próximo nascimento.<br>No treino, a aplicação seguirá a regra de equipamento imediato.</p><div class="actions"><button class="primary" onclick="equippedClass=selectedClass;render(false);toast('Classe escolhida somente no protótipo. Nenhum equipamento real foi alterado.')">Escolher classe <span>A</span></button><button class="quiet" onclick="go('attachments')">Editar equipamento · X</button></div><p class="spec-note">A silhueta é um estudo de composição, não o modelo real de cada arma. Nomes e classes desta página são exemplos locais.</p></section></div>`}
const attachments=[['Original','Sem acessório neste slot.'],['Mira compatível','Exemplo de item disponível.'],['Item bloqueado','Exemplo de requisito ainda não cumprido.']];let category='Mira';let mobilePreview=false;
function accessory(){return title('Armamentos / '+classes[selectedClass][1],'Acessórios','Ajuste seu equipamento para o próximo nascimento.')+`<nav class="section-nav" aria-label="Categorias de acessórios">${['Mira','Boca','Cano','Acoplamento','Carregador'].map(n=>`<button class="${category===n?'on':''}" onclick="category='${n}';attachment='Original';render(false)">${n}</button>`).join('')}</nav><div class="mobile-switch"><button class="quiet" onclick="mobilePreview=false;render(false)">Lista</button><button class="quiet" onclick="mobilePreview=true;render(false)">Arma e detalhes</button></div><div class="attachment-layout ${mobilePreview?'show-preview':'show-list'}"><div class="item-list">${attachments.map(([name,d],i)=>`<button class="item ${attachment===name?'on':''}" onclick="attachment='${name}';if(innerWidth<850)mobilePreview=true;render(false)"><span class="item-icon">${i===0?'—':i===1?'⌖':'♙'}</span><div><strong>${name}</strong><small>${d}</small></div></button>`).join('')}<p class="spec-note">Catálogo ilustrativo para testar estados. Não representa compatibilidade ou desbloqueios reais.</p></div><div><div class="weapon-meta"><h2>${classes[selectedClass][2]}</h2><span class="tag">PRÉVIA DO EQUIPAMENTO</span></div><div class="weapon-stage">${weapon()}</div><div class="detail"><div class="eyebrow">${category}</div><h3 style="margin-top:10px">${attachment}</h3><p class="subtle">${attachment==='Item bloqueado'?'O requisito deve aparecer aqui. Examinar um item bloqueado não o equipa.':'A descrição explica o que muda, sem sobrecarregar a leitura com informações repetidas.'}</p><div class="actions"><button class="primary" ${attachment==='Item bloqueado'?'disabled':''} onclick="toast('Ação ilustrativa. Nenhum acessório foi equipado no jogo.')">${attachment==='Item bloqueado'?'Indisponível':'Aplicar ao equipamento'}</button><button class="link" onclick="toast('Aqui será aberto o comparativo sustentado pelos dados da modalidade.')">Ver detalhes →</button></div></div></div></div>`}
const bindings=[['Mover','W A S D'],['Mirar','Mouse 2'],['Atirar','Mouse 1'],['Recarregar','R'],['Trocar arma','Y'],['Pular','Espaço']];let bindingIndex=0;
function keyboard(){return `<div class="key-grid" aria-label="Teclado ilustrado">${['Esc','1','2','3','4','5','6','7','8','9','0','⌫','Tab','Q','W','E','R','T','Y','U','I','O','P','↵','⇧','A','S','D','F','G','H','J','K','L',';','↑','Ctrl','Alt','Espaço','Alt','←','↓','→'].map(k=>`<div class="key ${['W','A','S','D','R','Y','Espaço'].includes(k)?'used':''} ${bindingIndex===0&&['W','A','S','D'].includes(k)||bindings[bindingIndex][1]===k?'focus':''} ${k==='Espaço'?'wide':''}">${k}</div>`).join('')}</div>`}
function gamepad(){const ps=device==='PlayStation';return `<div class="pad"><svg viewBox="0 0 600 340" role="img" aria-label="Diagrama ${device}"><path d="M140 70Q300 20 460 70L550 260Q540 320 485 290L400 215H200L115 290Q60 320 50 260Z" fill="#1a2c33" stroke="#738a90" stroke-width="3"/><circle cx="200" cy="175" r="42" fill="#102026" stroke="#27ded8"/><circle cx="365" cy="195" r="42" fill="#102026" stroke="#6a858b"/><path d="M140 105h22v25h25v22h-25v25h-22v-25h-25v-22h25Z" fill="#7a9499"/>${[[450,110,ps?'△':'Y'],[485,145,ps?'○':'B'],[450,180,ps?'×':'A'],[415,145,ps?'□':'X']].map(([x,y,n])=>`<circle cx="${x}" cy="${y}" r="17" fill="#183b3f" stroke="#24ded8"/><text x="${x}" y="${y+5}" fill="#d1ffff" text-anchor="middle" font-size="15">${n}</text>`).join('')}<text x="300" y="105" fill="#9cb2b8" text-anchor="middle" font-size="15">${ps?'PLAYSTATION':'XBOX'}</text></svg></div>`}
function controls(){return title('Configurações / Controles','Veja o que cada comando faz.','Escolha uma ação para localizá-la no método de entrada.')+`<nav class="section-nav">${['Keyboard','Xbox','PlayStation'].map(d=>`<button class="${device===d?'on':''}" onclick="device='${d}';render(false)">${d==='Keyboard'?'Teclado e mouse':d}</button>`).join('')}</nav><div class="device-layout"><section>${bindings.map(([n,k],i)=>`<div class="control-row ${i===bindingIndex?'on':''}"><span>${n}</span><button onclick="bindingIndex=${i};render(false)">${device==='Keyboard'?k:['Analógico E','LT / L2','RT / R2','X / □','Y / △','A / ×'][i]}</button></div>`).join('')}<p class="hint">Seleção visual neste protótipo. O remapeamento real preservará ações compartilhadas e validação de conflitos.</p></section><section>${device==='Keyboard'?keyboard():gamepad()}<p class="hint">Teclas usadas em destaque; ação selecionada com contraste maior. Representação escolhida manualmente neste estudo, sem simular identificação de plataforma.</p></section></div>`}
function settings(){return title('Configurações','Do seu jeito.','Categorias diretas, sem abrir uma coluna para cada nível.')+`<div class="settings-grid">${[['Controles','Teclado, mouse e controle.','controls'],['Câmera e mira','Sensibilidade, FOV e comportamento.',''],['Acessibilidade','Leitura, contraste e movimento.',''],['Áudio','Volumes e retorno sonoro.',''],['Aparência','Interface atual ou Nova. Paleta independente.',''],['HUD e avisos','Posição do XP e prévia de mira.','hud']].map(([n,d,id])=>`<button class="card" onclick="${id?`go('${id}')`:`modal('${n}','Esta página ainda é um destino de planejamento. O protótipo não altera preferências reais.')`}"><h3>${n} ↗</h3><p class="subtle">${d}</p></button>`).join('')}</div><button class="link" onclick="soundEnabled=!soundEnabled;render(false)">${soundEnabled?'Desativar':'Ativar'} sons de teste</button><p class="hint">Tons sintetizados apenas para experimentar foco/ação; não são a proposta final de áudio.</p>`}
function touchIcon(id){const paths={fire:'M12 3v5m0 8v5M3 12h5m8 0h5M7 7a7 7 0 1 0 10 10A7 7 0 0 0 7 7',aim:'M4 9V4h5m6 0h5v5m0 6v5h-5M9 20H4v-5M8 12h8m-4-4v8',reload:'M5 8a8 8 0 1 1-1 7M5 3v5h5',jump:'M12 20V4m-6 6 6-6 6 6',slide:'M4 6h6l3 6h7M7 20l4-7m-3 4h12',sprint:'m4 8 6 4-6 4m8-8 6 4-6 4',switch:'M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4',more:'M5 11h1v2H5Zm6 0h1v2h-1Zm6 0h1v2h-1Z',camera:'M4 7h16v13H4ZM8 7l2-3h4l2 3M16 13a4 4 0 1 1-8 0 4 4 0 0 1 8 0'};return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[id]}"/></svg>`}
function touchControls(){return `<div class="touch-layer"><button class="joystick" aria-label="Mover — simulação" onpointerdown="this.classList.add('pressed')" onpointerup="this.classList.remove('pressed')" onpointercancel="this.classList.remove('pressed')"><span></span></button>${[['fire','Atirar',91,43,60],['aim','Mirar',79,41,48],['reload','Recarregar e interagir',70,60,46],['jump','Pular',92,57,50],['slide','Deslizar',82,61,46],['sprint','Correr',25,72,46],['switch','Trocar arma',64,80,46],['camera','Câmera',30,11,44],...(touchProfile==='simple'?[['more','Mais ações',30,11,44]]:[])].filter(([id])=>id!=='more').map(([id,label,x,y,size])=>`<button class="touch-button touch-${id}" style="left:${x}%;top:${y}%;width:${size}px;height:${size}px" aria-label="${label}" onclick="touchAction('${id}')">${touchIcon(id)}</button>`).join('')}${false&&quickOpen?`<div class="touch-quick" role="group" aria-label="Ações secundárias">${[['sprint','Correr'],['slide','Deslizar'],['camera','Câmera']].map(([id,label])=>`<button aria-label="${label}" onclick="touchAction('${id}');quickOpen=false;render(false)">${touchIcon(id)}<span>${label}</span></button>`).join('')}</div>`:''}</div>`}
function touchAction(id){if(id==='more'){quickOpen=!quickOpen;render(false)}else if(id==='aim'){scoped=!scoped;render(false)}else if(id==='reload'){document.querySelector('.ammo').innerHTML='30 <small>/ 174</small>'}else if(id==='switch'){document.querySelector('.equipment .name').textContent='SECUNDÁRIA · PRÉVIA'}else{const b=document.querySelector('.touch-'+id);b?.classList.add('pressed');setTimeout(()=>b?.classList.remove('pressed'),180)}}
function hud(){const touch=previewInput==='touch'||previewInput==='auto'&&innerHeight<500;return `<div class="hud ${touch?'touch-mode':''} ${touch&&touchProfile==='simple'?'simple-mode':''} ${scoped?'scoped':''}"><div class="scope-guide" aria-label="Limite ilustrativo da lente"></div><div class="aim-point"></div><div class="map"></div><div class="flag-corners"></div><div class="top-score"><strong><span class="cyan">1</span>　03:42　<span class="red">0</span></strong><small>CAPTURE A BANDEIRA</small></div><button class="quiet menu" onclick="go('home')">♡ Menu</button><div class="flag"><span class="flag-icon">⚑</span><div><strong>VOCÊ ESTÁ COM A BANDEIRA</strong><small>Retorne à sua base</small></div></div><div class="feed"><div>Jogador A　⌁　Jogador B</div><div class="own">Você　<span style="color:#ffad57">☠</span>　Jogador C</div></div><div class="ribbon" role="status"><span>BANDEIRA INIMIGA CAPTURADA</span><span class="direction" aria-hidden="true">»</span></div><div class="reward ${xpPlacement==='reticle'?'reticle':''}"><strong id="streak">×2</strong><span id="rewardXP">+100 XP</span><b title="Medalha ilustrativa">☠</b></div><div class="vitals"><small>CONDIÇÃO</small><div class="health"><span>255 / 300</span></div><div class="stamina"></div></div><div class="equipment"><div class="name">M4A1</div><div class="equipment-main"><div class="ammo">24 <small>/ 180</small></div>${weapon()}</div><div class="equipment-secondary">${weapon()}<span>╱</span></div></div>${touch?touchControls():''}<div class="hud-controls"><button class="quiet" onclick="previewInput='touch';touchProfile=touchProfile==='simple'?'expanded':'simple';quickOpen=false;render(false)">Centro: ${touchProfile==='simple'?'Livre':'Comparação anterior'}</button><button class="quiet" onclick="previewInput=previewInput==='touch'?'desktop':'touch';render(false)">Método: ${touch?'Toque':'PC / Console'}</button><button class="quiet" onclick="xpPlacement=xpPlacement==='bottom'?'reticle':'bottom';render(false)">XP: ${xpPlacement==='bottom'?'Embaixo':'Esquerda do retículo'}</button><button class="quiet" onclick="scoped=!scoped;render(false)">Scope: ${scoped?'ativo':'desativado'}</button><button class="quiet" onclick="simulateKill()">Simular eliminação</button><button class="quiet" onclick="go('home')">Sair do estudo</button></div><div class="hud-footer">HUD DE ESTUDO · VALORES, SILHUETAS E EVENTOS ILUSTRATIVOS · SEM XP REAL</div></div>`}
function placeholder(name,desc){return title('DESTINO PLANEJADO',name,desc)+`<div class="card" style="max-width:750px"><h3>Esta jornada será detalhada no próximo corte.</h3><p class="subtle" style="margin-top:15px">O protótipo atual prioriza inicial, entrada, equipamento e remapeamento. Esta página identifica um destino, sem apresentar um sistema incompleto como pronto.</p><button class="link" onclick="go('home')">Voltar à inicial →</button></div>`}
function render(focus=true){const id=location.hash.slice(1)||'home';screen=id;document.querySelector('#crumb').textContent=({home:'INICIAL / ALTERNATIVA A','home-b':'INICIAL / ALTERNATIVA B',modes:'JOGAR',loadouts:'ARMAMENTOS',attachments:'EDITAR EQUIPAMENTO',controls:'CONTROLES',settings:'CONFIGURAÇÕES',hud:'HUD / ETAPA FUTURA'})[id]||id.toUpperCase();app.innerHTML=({home:()=>home(), 'home-b':()=>home(true),modes,loadouts,attachments:accessory,controls,settings,hud,career:()=>placeholder('Carreira','Perfil, estatísticas, desbloqueios e rankings em uma jornada.'),social:()=>placeholder('Social','Amigos, grupo e guilda reunidos sem perder seus contextos.')})[id]?.()||home();app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');document.querySelector('header').style.visibility=id==='hud'?'hidden':'visible';if(focus){window.scrollTo(0,0);requestAnimationFrame(()=>app.querySelector('button:not(:disabled)')?.focus({preventScroll:true}))}}
function toast(text){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.role='status';el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),4000);sound('confirm')}
let modalFocus;function modal(title,text){modalFocus=document.activeElement;const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML=`<section class="card modal" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2><p class="subtle">${text}</p><button class="primary" onclick="closeModal()">Entendido</button></section>`;document.body.append(el);el.querySelector('button').focus()}
function closeModal(){document.querySelector('.modal-backdrop')?.remove();modalFocus?.isConnected&&modalFocus.focus()}
function openMusic(){modal('Música, sem sair do contexto.','Painel rápido proposto para playlist, volume e reprodução. Nenhuma faixa é transmitida neste estudo.')}
let simulatedStreak=2;function simulateKill(){simulatedStreak++;document.querySelector('#streak').textContent='×'+simulatedStreak;document.querySelector('#rewardXP').textContent='+'+(simulatedStreak*50)+' XP';sound('confirm')}
window.addEventListener('hashchange',()=>render());document.addEventListener('click',e=>{if(e.target.closest('button'))sound('confirm')});document.addEventListener('focusin',e=>{if(e.target.matches('button'))sound()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();back()}if(document.querySelector('.modal-backdrop')){if(e.key==='Tab'){e.preventDefault();document.querySelector('.modal button')?.focus()}return}if(['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)){const buttons=[...app.querySelectorAll('button:not(:disabled)')].filter(b=>b.getClientRects().length);const i=buttons.indexOf(document.activeElement);const next=e.key==='ArrowDown'||e.key==='ArrowRight'?1:-1;buttons[(i+next+buttons.length)%buttons.length]?.focus();e.preventDefault()}if(e.key.toLowerCase()==='x'&&screen==='loadouts')go('attachments')});render();window.prototypeReady=location.href;
</script></html>
